project_id = "medicinkoll"

[auth]
site_url = "https://biggles22.github.io/medicinlogg/"
additional_redirect_urls = [
  "https://biggles22.github.io/medicinlogg/",
  "https://biggles22.github.io/medicinlogg/oauth/consent/",
  "http://localhost:8000",
  "http://localhost:8000/oauth/consent/"
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[functions.medication-context]
verify_jwt = false

[functions.medication-summary]
verify_jwt = false

[functions.current-medications]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

[functions.oauth-authorize]
verify_jwt = false

[functions.oauth-consent]
verify_jwt = false

[functions.oauth-token]
verify_jwt = false

[functions.oauth-revoke]
verify_jwt = false
